<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段码屏 · 八个小灯</title>
<style>
  :root {
    --led-off: #1b1e24;
    --led-on: #ffe14d;
    --led-on-glow: rgba(255, 225, 77, 0.95);
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: radial-gradient(circle at 50% 30%, #10161f, var(--bg));
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    text-align: center;
  }
  .stage {
    position: relative;
    width: 320px;
    height: 320px;
  }
  .led {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54px;
    height: 54px;
    margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: var(--led-off);
    border: 2px solid #2a3038;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    transform: rotate(var(--a)) translateY(-128px);
    cursor: pointer;
    transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .led:hover {
    border-color: #5a6470;
  }
  .led .label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #4b5563;
    transform: rotate(calc(-1 * var(--a)));
    transition: color 0.15s ease;
    pointer-events: none;
  }
  .led.on {
    background: var(--led-on);
    border-color: #fff3a1;
    box-shadow: 0 0 22px var(--led-on-glow), 0 0 52px var(--led-on-glow),
                inset 0 0 10px rgba(255,255,255,0.55);
  }
  .led.on .label { color: #1a1a00; }
  .status {
    font-size: 15px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    min-width: 240px;
    text-align: center;
  }
  .status b { color: var(--led-on); }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 420px;
  }
  .num-btn {
    width: 46px;
    height: 46px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #21262d;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
  }
  .num-btn:hover { background: #30363d; }
  .num-btn:active { transform: scale(0.94); }
  .num-btn.active {
    background: var(--led-on);
    border-color: #fff3a1;
    color: #1a1a00;
  }
  .reset-btn {
    padding: 12px 20px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #21262d;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .reset-btn:hover { background: #30363d; }
  .hint {
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div>
    <h1>段码屏 · 八个小灯</h1>
    <div class="subtitle">点击数字或小灯本身，对应的小灯亮起</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="status">当前：<b id="statusText">未点亮</b></div>

  <div class="controls" id="buttons"></div>
  <button class="reset-btn" id="resetBtn">全部熄灭</button>

  <div class="hint">点击 1–8 数字按钮或对应小灯即可点亮；再次点击同一个会熄灭</div>

<script>
(function () {
  const COUNT = 8;
  const stage = document.getElementById('stage');
  const buttons = document.getElementById('buttons');
  const statusText = document.getElementById('statusText');
  const resetBtn = document.getElementById('resetBtn');

  const leds = [];
  const numBtns = [];

  // 创建 8 个小灯，围绕圆心均匀分布（从顶部开始）
  for (let i = 0; i < COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'led';
    const angle = i * (360 / COUNT) - 90;
    el.style.setProperty('--a', angle + 'deg');
    el.title = '点亮第 ' + (i + 1) + ' 号小灯';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = i + 1;
    el.appendChild(label);
    stage.appendChild(el);
    leds.push(el);
  }

  // 创建 8 个数字按钮
  for (let i = 0; i < COUNT; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = i + 1;
    buttons.appendChild(btn);
    numBtns.push(btn);
  }

  let selected = null; // 当前点亮的小灯索引，null 表示全部熄灭

  function render() {
    leds.forEach((l, i) => l.classList.toggle('on', i === selected));
    numBtns.forEach((b, i) => b.classList.toggle('active', i === selected));
    statusText.textContent = selected === null ? '未点亮' : '第 ' + (selected + 1) + ' 号小灯亮起';
  }

  function toggle(i) {
    selected = (selected === i) ? null : i;
    render();
  }

  leds.forEach((el, i) => el.addEventListener('click', () => toggle(i)));
  numBtns.forEach((btn, i) => btn.addEventListener('click', () => toggle(i)));
  resetBtn.addEventListener('click', () => { selected = null; render(); });

  render();
})();
</script>
</body>
</html>
