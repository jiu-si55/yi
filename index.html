<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段码屏循环点亮 · 八个小灯</title>
<style>
  :root {
    --led-off: #1b1e24;
    --led-loop: #ff3b3b;
    --led-loop-glow: rgba(255, 59, 59, 0.85);
    --led-select: #ffe14d;
    --led-select-glow: rgba(255, 225, 77, 0.95);
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(circle at 50% 30%, #10161f, var(--bg));
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    text-align: center;
  }
  .stage {
    position: relative;
    width: 320px;
    height: 320px;
  }
  .led {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54px;
    height: 54px;
    margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: var(--led-off);
    border: 2px solid #2a3038;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    transform: rotate(var(--a)) translateY(-128px);
    transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .led .label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #4b5563;
    transform: rotate(calc(-1 * var(--a)));
    transition: color 0.15s ease;
  }
  .led.on-loop {
    background: var(--led-loop);
    border-color: #ff7a7a;
    box-shadow: 0 0 16px var(--led-loop-glow), 0 0 34px var(--led-loop-glow),
                inset 0 0 8px rgba(255,255,255,0.25);
  }
  .led.on-loop .label { color: #fff; }
  .led.on-select {
    background: var(--led-select);
    border-color: #fff3a1;
    box-shadow: 0 0 22px var(--led-select-glow), 0 0 52px var(--led-select-glow),
                inset 0 0 10px rgba(255,255,255,0.55);
  }
  .led.on-select .label { color: #1a1a00; }
  .status {
    font-size: 15px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    min-width: 240px;
    text-align: center;
  }
  .status b { color: var(--led-select); }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  input {
    width: 120px;
    padding: 10px 12px;
    font-size: 16px;
    text-align: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
  }
  input:focus { border-color: #58a6ff; }
  button {
    padding: 10px 18px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #21262d;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #30363d; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.primary:hover { background: #388bfd; }
  .hint {
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div>
    <h1>段码屏循环点亮</h1>
    <div class="subtitle">八个小灯 · 循环跑动 · 输入数字点亮对应小灯一秒</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="status">当前：<b id="statusText">循环点亮中…</b></div>

  <div class="controls">
    <input id="numInput" type="text" inputmode="numeric" maxlength="1" placeholder="1–8">
    <button class="primary" id="btnLight">点亮</button>
    <button id="btnLoop">恢复循环</button>
  </div>
  <div class="hint">输入 1–8 之间的数字，对应位置的小灯会点亮 1 秒</div>

<script>
(function () {
  const COUNT = 8;
  const stage = document.getElementById('stage');
  const statusText = document.getElementById('statusText');
  const numInput = document.getElementById('numInput');
  const btnLight = document.getElementById('btnLight');
  const btnLoop = document.getElementById('btnLoop');

  // 创建 8 个小灯，围绕圆心均匀分布
  const leds = [];
  for (let i = 0; i < COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'led';
    const angle = i * (360 / COUNT) - 90; // 从顶部开始
    el.style.setProperty('--a', angle + 'deg');
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = i + 1;
    el.appendChild(label);
    stage.appendChild(el);
    leds.push(el);
  }

  let current = 0;
  let loopTimer = null;
  let selectTimer = null;
  let paused = false;

  function clearAll() {
    leds.forEach(l => l.classList.remove('on-loop', 'on-select'));
  }

  function showLoop(index) {
    clearAll();
    leds[index].classList.add('on-loop');
  }

  function startLoop() {
    stopTimers();
    paused = false;
    clearAll();
    current = 0;
    showLoop(current);
    statusText.textContent = '循环点亮中…';
    loopTimer = setInterval(() => {
      current = (current + 1) % COUNT;
      showLoop(current);
    }, 450);
  }

  function stopTimers() {
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
    if (selectTimer) { clearTimeout(selectTimer); selectTimer = null; }
  }

  function lightOne(n) { // n: 0-based index
    stopTimers();
    paused = true;
    clearAll();
    leds[n].classList.add('on-select');
    statusText.textContent = '点亮第 ' + (n + 1) + ' 号小灯';
    selectTimer = setTimeout(() => {
      if (paused) startLoop();
    }, 1000);
  }

  function handleInput() {
    const v = parseInt(numInput.value.trim(), 10);
    if (isNaN(v) || v < 1 || v > COUNT) {
      statusText.textContent = '请输入 1–' + COUNT + ' 之间的数字';
      return;
    }
    lightOne(v - 1);
  }

  btnLight.addEventListener('click', handleInput);
  btnLoop.addEventListener('click', startLoop);
  numInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleInput();
  });

  startLoop();
})();
</script>
</body>
</html>
