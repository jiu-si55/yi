<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七段码屏 · 八个小灯</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #0a0f16;
    --panel-border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --seg-off: #252a31;
    --seg-on: #ff4d3d;
    --seg-glow: rgba(255, 77, 61, 0.85);
    --led-off: #1b1e24;
    --led-on: #ffe14d;
    --led-glow: rgba(255, 225, 77, 0.95);
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(circle at 50% 25%, #10161f, var(--bg));
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: 2px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 6px; text-align: center; }

  /* 七段码显示屏 */
  .display-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 26px 30px;
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.55);
  }
  .seven-seg svg {
    display: block;
    width: 120px;
    height: auto;
  }
  .seg {
    fill: var(--seg-off);
    transition: fill 0.12s ease, filter 0.12s ease;
  }
  .seg.on {
    fill: var(--seg-on);
    filter: drop-shadow(0 0 6px var(--seg-glow)) drop-shadow(0 0 14px var(--seg-glow));
  }

  /* 一排八个小灯 */
  .lights-row {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .light {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--led-off);
    border: 2px solid #2a3038;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 700;
    color: #4b5563;
    transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .light.on {
    background: var(--led-on);
    border-color: #fff3a1;
    color: #1a1a00;
    box-shadow: 0 0 20px var(--led-glow), 0 0 44px var(--led-glow),
                inset 0 0 8px rgba(255,255,255,0.5);
  }

  .status {
    font-size: 15px;
    background: #161b22;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 16px;
    min-width: 280px;
    text-align: center;
  }
  .status b { color: var(--led-on); }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .controls input {
    width: 120px;
    padding: 10px 12px;
    font-size: 16px;
    text-align: center;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #161b22;
    color: var(--text);
    outline: none;
  }
  .controls input:focus { border-color: #58a6ff; }
  .btn {
    padding: 10px 18px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #21262d;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #30363d; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: #388bfd; }

  .num-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .num-btn {
    width: 44px;
    height: 44px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #21262d;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .num-btn:hover { background: #30363d; }
  .num-btn:active { transform: scale(0.94); }

  .hint { color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <div>
    <h1>七段码屏 · 八个小灯</h1>
    <div class="subtitle">输入 1–8，七段码屏显示对应数字，同时对应小灯点亮 2 秒</div>
  </div>

  <!-- 七段码显示屏 -->
  <div class="display-panel">
    <div class="seven-seg">
      <svg viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">
        <polygon id="seg-a" class="seg" points="20,0 80,0 88,8 80,16 20,16 12,8"/>
        <polygon id="seg-b" class="seg" points="92,16 100,24 100,74 92,82 84,74 84,24"/>
        <polygon id="seg-c" class="seg" points="92,98 100,106 100,156 92,164 84,156 84,106"/>
        <polygon id="seg-d" class="seg" points="20,164 80,164 88,172 80,180 20,180 12,172"/>
        <polygon id="seg-e" class="seg" points="8,98 16,106 16,156 8,164 0,156 0,106"/>
        <polygon id="seg-f" class="seg" points="8,16 16,24 16,74 8,82 0,74 0,24"/>
        <polygon id="seg-g" class="seg" points="20,82 80,82 88,90 80,98 20,98 12,90"/>
      </svg>
    </div>
  </div>

  <!-- 一排八个小灯 -->
  <div class="lights-row" id="lightsRow"></div>

  <div class="status">当前：<b id="statusText">未显示</b></div>

  <div class="controls">
    <input id="numInput" type="text" inputmode="numeric" maxlength="1" placeholder="输入 1–8">
    <button class="btn primary" id="btnShow">显示</button>
  </div>

  <div class="num-row" id="numButtons"></div>

  <div class="hint">在输入框输入数字（回车或点“显示”），或直接点击数字按钮 1–8</div>

<script>
(function () {
  const segOrder = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];
  const segEls = {};
  segOrder.forEach(k => { segEls[k] = document.getElementById('seg-' + k); });

  // 数字 1-8 的七段码（a,b,c,d,e,f,g）
  const DIGITS = {
    1: '0110000',
    2: '1101101',
    3: '1111001',
    4: '0110011',
    5: '1011011',
    6: '1011111',
    7: '1110000',
    8: '1111111'
  };

  const lightsRow = document.getElementById('lightsRow');
  const numButtons = document.getElementById('numButtons');
  const statusText = document.getElementById('statusText');
  const numInput = document.getElementById('numInput');
  const btnShow = document.getElementById('btnShow');

  // 生成一排 8 个小灯
  const lights = [];
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('div');
    el.className = 'light';
    el.textContent = i + 1;
    lightsRow.appendChild(el);
    lights.push(el);
  }

  // 生成数字按钮 1-8
  const numBtns = [];
  for (let i = 0; i < 8; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = i + 1;
    numButtons.appendChild(btn);
    numBtns.push(btn);
  }

  let timer = null;

  function showDigit(n) {
    const p = DIGITS[n];
    segOrder.forEach((k, i) => segEls[k].classList.toggle('on', p[i] === '1'));
  }
  function clearDigit() {
    segOrder.forEach(k => segEls[k].classList.remove('on'));
  }
  function lightOn(n) {
    lights.forEach((l, i) => l.classList.toggle('on', i === n - 1));
  }
  function lightsOff() {
    lights.forEach(l => l.classList.remove('on'));
  }

  function show(n) {
    if (timer) { clearTimeout(timer); timer = null; }
    showDigit(n);
    lightOn(n);
    statusText.textContent = '显示数字 ' + n + ' · 第 ' + n + ' 号小灯亮起';
    timer = setTimeout(() => {
      clearDigit();
      lightsOff();
      statusText.textContent = '未显示';
      timer = null;
    }, 2000);
  }

  function handleInput() {
    const v = parseInt(numInput.value.trim(), 10);
    if (isNaN(v) || v < 1 || v > 8) {
      statusText.textContent = '请输入 1–8 之间的数字';
      return;
    }
    numInput.value = '';
    show(v);
  }

  btnShow.addEventListener('click', handleInput);
  numInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleInput(); });
  numBtns.forEach((btn, i) => btn.addEventListener('click', () => show(i + 1)));
})();
</script>
</body>
</html>
